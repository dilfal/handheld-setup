# Catalogo delle app candidate.
# tipo: "flatpak" (rif = ID Flathub) | "brew" (rif = pacchetto Homebrew) | "ujust" (rif = ricetta) | "manuale" (rif = URL, nessuna installazione automatica)
# verificato = false: ID/ricetta scritti a memoria, da controllare sul dispositivo (flatpak remote-info flathub <ID>).

# ── Launcher di giochi ──────────────────────────────────────────────
[[app]]
id = "heroic"
nome = "Heroic Games Launcher"
descrizione = "Giochi di Epic, GOG e Amazon Games."
categoria = "launcher"
tipo = "flatpak"
rif = "com.heroicgameslauncher.hgl"

[[app]]
id = "lutris"
nome = "Lutris"
descrizione = "Gestore di giochi per Windows, emulatori e altri launcher."
categoria = "launcher"
tipo = "flatpak"
rif = "net.lutris.Lutris"

[[app]]
id = "bottles"
nome = "Bottles"
descrizione = "Ambienti Wine separati per programmi e giochi Windows."
categoria = "launcher"
tipo = "flatpak"
rif = "com.usebottles.bottles"

[[app]]
id = "prism"
nome = "Prism Launcher"
descrizione = "Launcher per Minecraft con più istanze."
categoria = "launcher"
tipo = "flatpak"
rif = "org.prismlauncher.PrismLauncher"

[[app]]
id = "srm"
nome = "Steam ROM Manager"
descrizione = "Aggiunge giochi ed emulatori alla libreria di Steam, con le copertine."
categoria = "launcher"
tipo = "flatpak"
rif = "com.steamgriddb.steam-rom-manager"

