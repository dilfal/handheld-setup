[[passo]]
titolo = "Lossless Scaling: immagine centrata e a tutto schermo"
solo = ["onexplayer1s"]
bazzite = false
dove = "windows"
testo = """
Lo schermo del OneXPlayer 1S nasce in verticale e Windows lo gira: in **Schermo intero** a 1280×800 l'immagine resta piccola in basso a sinistra. Per questo {nome} va in **Finestra** a 1280×800 e a portarlo a tutto schermo ci pensa **Lossless Scaling** (si compra su Steam).

1. Apri Lossless Scaling e crea un profilo per {nome}, poi apri **Modifica profilo**.
2. Nel filtro scrivi tutte e quattro le voci: `RDR2.exe`, `RDR2`, `Red Dead Redemption 2` e il percorso completo di `RDR2.exe` (per trovarlo, in Steam: clic destro sul gioco → **Gestisci → Sfoglia file locali**).
3. Sempre in **Modifica profilo**, attiva **Ridimensionamento automatico** e porta il ritardo a **20 secondi**.
4. Prima di avviare il gioco apri Lossless Scaling (può restare ridotto a icona): 20 secondi dopo che compare la finestra di {nome}, l'immagine si ingrandisce da sola.

Se non succede, tocca una volta la finestra del gioco perché torni in primo piano; altrimenti premi **Scala** in Lossless Scaling e scegli la finestra del gioco a mano.
"""

