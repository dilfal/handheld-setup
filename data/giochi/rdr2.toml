id = "rdr2"
nome = "Red Dead Redemption 2"
ordine = 1

# Fonti dei valori: guida ufficiale ASUS per la ROG Ally (9 giugno 2023, 1080p con FSR 2 Qualità, 40-50 FPS in Turbo);
# per il OneXPlayer le impostazioni ottimizzate per Steam Deck (pcoptimizedsettings.com, 13 giugno 2024), senza FSR
# perché a 1280×800 sgranerebbe: la Iris Xe è un po' più lenta della Deck, quindi l'obiettivo è 30 FPS.
# Le chiavi di system.xml sono controllate su cinque file reali (versione 37 del formato).
# Intervalli numerici: parser Forceflow/rdr2_settings_parser (lodScale 0,75–1; grassLod 0,5–3; waterSimulationQuality 0–4).
# L'indice del filtro anisotropico (2 = 4x, 3 = 8x) è da verificare sul dispositivo.

[obiettivo]
onexplayer1s = "Obiettivo: 30 FPS stabili a 1280×800 (la metà esatta dello schermo, quindi nitida), texture Ultra e il resto al minimo."
rogallyz1x = "Obiettivo: 40-50 FPS a 1080p con FSR 2 su Qualità e VRR, texture Ultra (impostazioni della guida ufficiale ASUS)."
generico = "Obiettivo: 30 FPS stabili a risoluzione ridotta, texture Ultra e il resto al minimo. È un punto di partenza prudente: sul tuo dispositivo potresti poter alzare."

[parametri]
eseguibile = "RDR2.exe"
percorso_esempio = "~/Giochi/Red Dead Redemption 2/RDR2.exe"
nota_eseguibile = "Se la tua copia parte da un altro file (per esempio `Launcher.exe`), scegli quello."
primo_avvio = "Premi **Gioca**, aspetta il menu principale (la prima volta il gioco prepara i suoi file e può volerci qualche minuto), poi esci dal gioco dal suo menu."
zona_prova = "Saint Denis, o Valentine con la pioggia"
nota_origine = "- **Comprato da Rockstar o Epic:** ha bisogno del Rockstar Games Launcher; installalo con Heroic o Lutris (questa guida non lo copre). Quando il gioco parte, riprendi dal passo «Scrivi le impostazioni grafiche» e, se il file non viene trovato, indicalo con «Scegli il file a mano»."

[parametri.onexplayer1s]
risoluzione = "1280×800"
perche_risoluzione = "Lo schermo è 2560×1600: a 1280×800 ogni punto del gioco diventa un quadrato di 2×2 punti dello schermo, senza sfocature, e la scheda video lavora su un quarto dei punti."
fps = "30"
tdp = "Profilo TDP 28W (con il caricatore collegato; a batteria 20W)"
se_scatta = "controlla di avere applicato il Profilo TDP 28W; se non basta, nel gioco attiva **FSR 2** su **Qualità** (l'immagine diventa un po' meno nitida), poi **Bilanciato**."
se_avanza = "alza una voce per volta, in quest'ordine: **Qualità illuminazione** su Media, poi **Qualità ombre** su Media."

[parametri.rogallyz1x]
risoluzione = "1920×1080"
perche_risoluzione = ""
fps = "Nessun limite (con il VRR va bene così); se preferisci consumi più bassi, 40"
tdp = "25 W (30 W con il caricatore collegato)"
se_scatta = "nel gioco porta **FSR 2** da Qualità a **Bilanciato**; se non basta abbassa **Qualità ombre** a Bassa."
se_avanza = "alza **Qualità illuminazione** ad Alta oppure **Ombre distanti** a Media; oppure abbassa il Limite TDP a 20 W e tieni la batteria più a lungo."

[parametri.generico]
risoluzione = "1280×800 (o 1280×720 su uno schermo 16:9)"
perche_risoluzione = "Una risoluzione più bassa di quella dello schermo è la scelta che pesa di più sui fotogrammi: parti da qui e alzala solo se il gioco regge."
fps = "30"
tdp = "il valore più alto che il dispositivo regge senza scaldare troppo"
se_scatta = "nel gioco attiva **FSR 2** su **Qualità** (Impostazioni → Grafica); se non basta passa a **Bilanciato**."
se_avanza = "alza la risoluzione di gioco, poi una voce per volta: **Qualità illuminazione**, **Qualità ombre**."

# Variante Windows (Winhanced): vedi l'intestazione di _comune.toml.
[parametri_windows]
primo_avvio = "Avvia il gioco con **Gioca in locale**, aspetta il menu principale (la prima volta il gioco prepara i suoi file e può volerci qualche minuto), poi esci dal gioco dal suo menu."
nota_origine = ""

[parametri_windows.onexplayer1s]
# Schermo intero a 1280×800 sul pannello verticale girato da Windows: immagine piccola in basso a sinistra (provato
# il 14 novembre 2026). Il gioco va in finestra e lo ingrandisce Lossless Scaling, quindi lo schermo resta nativo.
risoluzione = "2560×1600, cioè quella dello schermo (a ingrandire il gioco ci pensa Lossless Scaling)"
tdp = "28 W nel profilo «Collegato»; 20 W nel profilo «Batteria»"
se_scatta = "controlla di avere impostato 28 W nel profilo «Collegato»; se non basta, nel gioco attiva **FSR 2** su **Qualità** (l'immagine diventa un po' meno nitida), poi **Bilanciato**."

[parametri_windows.rogallyz1x]
limite_fps = "FPS illimitati (con il VRR va bene così); se preferisci consumi più bassi, 40"
tdp = "25 W nel profilo «Batteria»; 30 W nel profilo «Collegato»"
se_avanza = "alza **Qualità illuminazione** ad Alta oppure **Ombre distanti** a Media; oppure abbassa la potenza a 20 W e tieni la batteria più a lungo."

[[passo]]
titolo = "Scrivi le impostazioni grafiche"
dove = "app"
azione = "config"
testo = """
Con il gioco **chiuso**, premi **Applica**: il programma cerca il file `system.xml` di {nome} e cambia solo le voci grafiche elencate al passo successivo. Risoluzione, comandi e salvataggi non vengono toccati.

Prima di scrivere salva una copia del file: con **Ripristina** torni a com'era prima del primo Applica. Usalo con il gioco chiuso: le modifiche fatte dopo dal menu del gioco vanno perse.

Se il file non viene trovato, torna al passo «Primo avvio». Se qualche voce risulta mancante, la imposti a mano con la tabella del prossimo passo.
"""
titolo_windows = "Dove stanno le impostazioni grafiche"
dove_windows = "windows"
testo_windows = '''
Su Windows non c'è l'app che scrive le impostazioni al posto tuo: le voci grafiche le imposti a mano dal menu del gioco, con la tabella del passo successivo.

Il file delle impostazioni si chiama `system.xml` e sta nei Documenti di Windows, in `Documenti\Rockstar Games\Red Dead Redemption 2\Settings`. Compare dopo il primo avvio. Se i Documenti sono sincronizzati con OneDrive, la cartella è `OneDrive\Documenti\Rockstar Games\Red Dead Redemption 2\Settings`.

Se non lo trovi, torna al passo «Primo avvio».
'''

[[passo]]
titolo = "Controlla nel gioco e completa a mano"
dove = "gioco"
testo = """
1. Avvia {nome} e apri **Impostazioni → Grafica**.
2. Imposta le voci segnate **a mano**: il programma non le scrive.
3. Scorri le altre e controlla che corrispondano (se hai premuto Applica dovrebbero esserlo già).
4. In fondo, le **Impostazioni avanzate** devono essere **sbloccate** per vedere la seconda metà dell'elenco.

Tra parentesi c'è il nome inglese della voce: in italiano può essere scritta in modo un po' diverso.
"""
titolo_windows = "Imposta la grafica nel gioco"
testo_windows = '''
1. Avvia {nome} con **Gioca in locale** e apri **Impostazioni → Grafica**.
2. Imposta le voci della tabella qui sotto: su Windows sono tutte da fare a mano.
3. In fondo, le **Impostazioni avanzate** devono essere **sbloccate** per vedere la seconda metà dell'elenco.

Tra parentesi c'è il nome inglese della voce: in italiano può essere scritta in modo un po' diverso.
'''
nota_app = "Per non andare avanti e indietro tra il gioco e questa finestra, apri la stessa tabella sul telefono: `070293.xyz/{pagina_web}`"

