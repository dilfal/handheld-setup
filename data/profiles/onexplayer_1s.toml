id = "onexplayer1s"
nome = "OneXPlayer 1S (8,4\", i7-1195G7)"
descrizione = "OneXPlayer 1S con Intel Tiger Lake (Iris Xe), 16 GB di RAM e SSD da 1 TB. Bazzite non lo supporta ufficialmente."
note = [
  "Senza la correzione INTEL_DEBUG=norbc la Gaming Mode parte con lo schermo nero: è tra le impostazioni consigliate e viene applicata anche in automatico lanciando `curl -L 070293.xyz/oxp | sh` da console (Ctrl+Alt+F3).",
  "TDP (Intel RAPL): il cursore TDP di Steam è pensato per AMD, ma l'i7-1195G7 espone Intel RAPL nel kernel: puoi impostare i profili da 15W (Silenzioso), 20W (Bilanciato, consigliato) o 28W (Turbo) direttamente dai Tweak.",
  "Ventole e Modalità Notte (Silenziosa): il driver Linux `oxp-sensors` non supporta le schede Intel, ma puoi attivare la Modalità Silenziosa hardware tenendo premuto per 2 secondi il tasto fisico MUTE sul retro del OneXPlayer 1S, oppure mantenendo il TDP a 15W/20W.",
  "Modalità Cura Batteria (80%): attiva il monitor con avviso automatico al raggiungimento dell'80% di carica (o il blocco hardware se esposto dal kernel).",
  "Se un gioco va in crash sulla Iris Xe (VK_ERROR_DEVICE_LOST), prova l'opzione di avvio Steam `INTEL_DEBUG=stall %command%` (Bazzite #6110).",
]

# Fonte: guida di Retro Think sul OneXPlayer 1S (7 novembre 2026), verificata su un dispositivo reale:
# product_name = "ONE XPLAYER".
[match]
fornitori = ["ONE-NETBOOK"]
prodotti = ["ONE XPLAYER"]

[tweak]
consigliati = ["tema_scuro", "scala_display_150", "tastiera_schermo", "intel_norbc", "limite_carica_80", "tdp_20w"]
avanzati = ["scala_display_125", "luminosita_game_mode", "tdp_15w", "tdp_28w", "carica_100", "blocca_versione", "aria2_conf", "mullvad_vpn", "aggiorna_sistema"]
